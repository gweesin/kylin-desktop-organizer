name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    # 与发布工作流一致的容器：glibc/GTK 版本贴近银河麒麟 V10 运行环境
    container:
      image: ubuntu:20.04
    steps:
      - name: 预装 git（容器内 checkout 需要）
        run: |
          apt-get update -qq
          apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@v4
      - name: 安装 GTK3 等系统依赖
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-3-dev libglib2.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 运行单元与集成测试
        run: cargo test --locked
      - name: 编译发布版本
        run: cargo build --release --locked
